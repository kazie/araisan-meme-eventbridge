name: Java CI with Gradle

# Builds through the flake (nix run .#build), so CI uses the same JDK as dhole's nightly build and a
# flake.lock bump that breaks it fails here. The job is the required check `build` (ruleset "master
# needs CI"), and the tests run in it because Dependabot PRs merge, and dhole deploys master, by themselves.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: read # For actions/upload-artifact

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: nix run .#build -- linkReleaseExecutableHost hostTest

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: araisan-meme-server
          path: build/bin/host/releaseExecutable/araisan-meme-server.kexe
